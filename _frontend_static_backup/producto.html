<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto | Van Gogh</title>

  <link rel="stylesheet" href="css/inicio.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle" />
 
</head>
<body class="pagina-detalle">

  <!-- Encabezado (Mantener igual que inicio para consistencia) -->
   <header>
  <div class="logo">
    <h1>Van Gogh</h1>
  </div>
  
  <nav class="nav-container">
    <!-- Enlaces principales -->
    <ul class="nav-links">
      <li><a href="inicio.html">Inicio</a></li>
      <li><a href="catalogo.html">Productos</a></li>
      <li><a href="ofertas.html">Ofertas</a></li>
      <li><a href="inicio.html#contacto">Contacto</a></li>
    </ul>

    <!-- Opción de Usuario en la esquina -->
    <div class="user-menu">
    <div class="dropdown">
        
        <button class="dropbtn"><span class="material-symbols-outlined">
account_circle
</span><i class="arrow down"></i></button>
        <div class="dropdown-content">
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html">Registrarse</a>
        </div>
    </div>
</div>
  </nav>
</header>

  <main class="contenedor-detalle">
    <section class="detalle-producto">
      
      <!-- Contenedor de Imagen -->
      <div class="imagen-producto">
        <!-- El id="img-principal" permitirá que JS cambie la imagen según el producto -->
        <img id="img-principal" src="img/placeholder.jpg" alt="Cargando producto...">
      </div>

      <!-- Contenedor de Información -->
      <div class="info-producto">
        <nav class="breadcrumb">
          <a href="inicio.html">Inicio</a> / <a href="catalogo.html">Catálogo</a> / <span id="categoria-txt">Categoría</span>
        </nav>
        
        <h2 id="nombre-producto">Nombre del Producto</h2>
        <p class="precio" id="precio-producto">Bs. 0.00</p>
        
        <div class="descripcion">
          <h3>Descripción</h3>
          <p id="descripcion-txt">Cargando detalles del producto desde el servidor...</p>
        </div>

        <!-- Opciones de Compra -->
        <div class="opciones">
          <label for="talla">Talla:</label>
          <select id="talla" name="talla">
            <option value="s">S</option>
            <option value="m">M</option>
            <option value="l">L</option>
            <option value="xl">XL</option>
          </select>
        </div>

        <div class="acciones">
          <input type="number" id="cantidad" value="1" min="1">
          <button class="btn-comprar" id="btn-agregar">Agregar al Carrito</button>
        </div>

        <p class="stock-info">Stock disponible: <span id="stock-num">0</span> unidades</p>
      </div>

    </section>
  </main>



  <!-- Script para capturar el ID y llenar los datos -->
  <script src="js/detalle.js"></script>
</body>
</html>
