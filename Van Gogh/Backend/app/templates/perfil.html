<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Van Gogh</title>
    <link rel="stylesheet" href="/static/css/inicio.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle,shopping_cart,logout" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body class="pagina-generica">
    <div class="swirl-container">
        <svg class="swirl-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <path d="M250,50 C350,50 450,150 450,250 C450,350 350,450 250,450 C150,450 50,350 50,250 C50,150 150,50 250,50 Z" fill="none" stroke="#d4af37" stroke-width="0.3"/>
            <path d="M250,100 C320,100 400,180 400,250 C400,320 320,400 250,400 C180,400 100,320 100,250 C100,180 180,100 250,100 Z" fill="none" stroke="#4a6fa5" stroke-width="0.2"/>
        </svg>
    </div>

    <header>
        <div class="logo">
            <h1>Van Gogh</h1>
        </div>
        <nav class="nav-container">
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/catalogo">Productos</a></li>
                <li><a href="/ofertas">Ofertas</a></li>
                <li><a href="/#contacto">Contacto</a></li>
            </ul>
            <div class="user-menu">
                <div class="dropdown">
                    <button class="dropbtn"><span class="material-symbols-outlined">account_circle</span></button>
                    <div class="dropdown-content" id="user-dropdown">
                        <a href="/login">Iniciar Sesión</a>
                        <a href="/registro">Registrarse</a>
                    </div>
                </div>
                <a href="/carrito" id="cart-icon-container" class="cart-link" style="position: relative; margin-left: 15px;">
                    <span class="material-symbols-outlined" style="font-size: 28px; color: #dfdd8c;">shopping_cart</span>
                    <span id="cart-count" style="position: absolute; top: -5px; right: -8px; background: #ff4757; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; display: none;">0</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="contenedor-admin" style="max-width: 900px;">
        <div class="admin-header-bar">
            <div>
                <h2>Mi Perfil</h2>
                <p id="profile-email"></p>
            </div>
            <button id="btn-logout-profile" class="btn-small btn-secundario" style="display:none;">Cerrar Sesión</button>
        </div>

        <!-- Direcciones -->
        <div class="admin-card" style="margin-bottom: 30px;">
            <div class="admin-header">
                <h3>Mis Direcciones</h3>
                <button id="btn-nueva-direccion" class="btn-small">+ Añadir Dirección</button>
            </div>
            <div id="lista-direcciones">
                <p style="color:rgba(255,255,255,0.5); padding:20px; text-align:center;">Cargando direcciones...</p>
            </div>
        </div>

        <!-- Mis Pedidos -->
        <div class="admin-card">
            <div class="admin-header">
                <h3>Mis Pedidos</h3>
            </div>
            <div id="lista-pedidos">
                <p style="color:rgba(255,255,255,0.5); padding:20px; text-align:center;">Cargando pedidos...</p>
            </div>
        </div>
    </main>

    <!-- Modal nueva dirección -->
    <div id="modal-direccion" class="modal" style="display:none;">
        <div class="modal-content" style="text-align:left; max-width:500px; margin:0 auto;">
            <span class="modal-close" id="modal-dir-close">&times;</span>
            <h3 style="color:#d4af37; margin-bottom:20px; text-align:center;">Nueva Dirección</h3>
            <form id="form-direccion">
                <div class="campo">
                    <label>Tipo</label>
                    <select id="dir-tipo">
                        <option value="Casa">Casa</option>
                        <option value="Oficina">Oficina</option>
                        <option value="Regalo">Regalo</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Nombre del destinatario</label>
                    <input type="text" id="dir-nombre" required>
                </div>
                <div class="campo">
                    <label>Calle</label>
                    <input type="text" id="dir-calle" required>
                </div>
                <div class="campo">
                    <label>Número exterior</label>
                    <input type="text" id="dir-numero">
                </div>
                <div class="campo">
                    <label>Ciudad</label>
                    <input type="text" id="dir-ciudad" required>
                </div>
                <div class="campo">
                    <label>Estado</label>
                    <input type="text" id="dir-estado">
                </div>
                <div class="campo">
                    <label>Código Postal</label>
                    <input type="text" id="dir-cp" required>
                </div>
                <div class="campo">
                    <label>País</label>
                    <input type="text" id="dir-pais" value="Mexico">
                </div>
                <button type="submit" class="btn-auth">Guardar Dirección</button>
            </form>
        </div>
    </div>
    <div id="modal-overlay" class="modal-overlay" style="display:none;"></div>

    <footer><p>&copy; 2026 Van Gogh. Todos los derechos reservados.</p></footer>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/perfil.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => { configurarAuth(); });</script>
</body>
</html>
