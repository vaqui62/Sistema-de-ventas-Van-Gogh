<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto | Van Gogh</title>
  <link rel="stylesheet" href="/static/css/inicio.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle" />
</head>
<body class="pagina-detalle">
   <header>
    <div class="logo"><h1>Van Gogh</h1></div>
    <nav class="nav-container">
      <ul class="nav-links">
        <li><a href="/">Inicio</a></li>
        <li><a href="/catalogo">Productos</a></li>
        <li><a href="/ofertas">Ofertas</a></li>
        <li><a href="/#contacto">Contacto</a></li>
      </ul>
      <div class="user-menu">
        <div class="dropdown">
          <button class="dropbtn"><span class="material-symbols-outlined">account_circle</span><i class="arrow down"></i></button>
          <div class="dropdown-content">
            <a href="/login">Iniciar Sesión</a>
            <a href="/registro">Registrarse</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="contenedor-detalle">
    <section class="detalle-producto">
      <div class="imagen-producto">
        <img id="img-principal" src="/static/img/placeholder.jpg" alt="Cargando producto...">
      </div>
      <div class="info-producto">
        <nav class="breadcrumb">
          <a href="/">Inicio</a> / <a href="/catalogo">Catálogo</a> / <span id="categoria-txt">Categoría</span>
        </nav>
        <h2 id="nombre-producto">Nombre del Producto</h2>
        <p class="precio" id="precio-producto">Bs. 0.00</p>
        <div class="descripcion">
          <h3>Descripción</h3>
          <p id="descripcion-txt">Cargando detalles del producto desde el servidor...</p>
        </div>
        <div class="opciones">
          <label for="talla">Talla:</label>
          <select id="talla" name="talla">
            <!-- Opciones generadas por JS -->
          </select>
        </div>
        <div class="acciones">
          <input type="number" id="cantidad" value="1" min="1">
          <button class="btn-comprar" id="btn-agregar">Agregar al Carrito</button>
        </div>
        <p class="stock-info">Stock disponible: <span id="stock-num">0</span> unidades</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Van Gogh. Todos los derechos reservados.</p>
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/producto.js"></script>
</body>
</html>
