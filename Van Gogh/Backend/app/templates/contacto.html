<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Van Gogh</title>
  <link rel="stylesheet" href="/static/css/inicio.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body class="pagina-generica">
  <div class="swirl-container">
    <svg class="swirl-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <path d="M250,50 C350,50 450,150 450,250 C450,350 350,450 250,450 C150,450 50,350 50,250 C50,150 150,50 250,50 Z" fill="none" stroke="#d4af37" stroke-width="0.3"/>
      <path d="M250,100 C320,100 400,180 400,250 C400,320 320,400 250,400 C180,400 100,320 100,250 C100,180 180,100 250,100 Z" fill="none" stroke="#4a6fa5" stroke-width="0.2"/>
    </svg>
  </div>
  <header>
    <div class="logo"><h1>Van Gogh</h1></div>
    <nav class="nav-container">
      <ul class="nav-links">
        <li><a href="/">Inicio</a></li>
        <li><a href="/catalogo">Productos</a></li>
        <li><a href="/ofertas">Ofertas</a></li>
        <li><a href="/contacto">Contacto</a></li>
      </ul>
      <div class="user-menu">
        <div class="dropdown">
          <button class="dropbtn"><span class="material-symbols-outlined">account_circle</span></button>
          <div class="dropdown-content">
            <a href="/login">Iniciar Sesión</a>
            <a href="/registro">Registrarse</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <section id="contacto" class="contacto">
    <h2>Contáctanos</h2>
    <form id="contacto-form">
      <input type="text" id="contacto-nombre" placeholder="Tu nombre" required>
      <input type="email" id="contacto-email" placeholder="Tu correo" required>
      <textarea id="contacto-mensaje" placeholder="Tu mensaje"></textarea>
      <button type="submit">Enviar</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 Van Gogh. Todos los derechos reservados.</p>
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/animations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      configurarAuth();
      document.getElementById('contacto-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Mensaje enviado. Te contactaremos pronto.');
        e.target.reset();
      });
    });
  </script>
</body>
</html>
