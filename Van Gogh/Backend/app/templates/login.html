<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Van Gogh</title>
    <link rel="stylesheet" href="/static/css/inicio.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle" />
</head>
<body class="pagina-auth">
    <header>
      <div class="logo"><h1>Van Gogh</h1></div>
      <nav class="nav-container">
        <ul class="nav-links">
          <li><a href="/">Inicio</a></li>
          <li><a href="/catalogo">Productos</a></li>
          <li><a href="/ofertas">Ofertas</a></li>
          <li><a href="/#contacto">Contacto</a></li>
        </ul>
        <div class="user-menu">
          <div class="dropdown">
            <button class="dropbtn"><span class="material-symbols-outlined">account_circle</span><i class="arrow down"></i></button>
            <div class="dropdown-content">
              <a href="/login">Iniciar Sesión</a>
              <a href="/registro">Registrarse</a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <div class="contenedor-auth">
        <form class="formulario-auth" id="login-form">
            <h2 class="titulo-auth">Iniciar Sesión</h2>
            <div class="campo">
                <label>Correo Electrónico</label>
                <input type="email" id="login-email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="campo">
                <label>Contraseña</label>
                <input type="password" id="login-password" placeholder="********" required>
            </div>
            <button type="submit" class="btn-auth">Entrar</button>
            <p class="enlace-auth">¿No tienes cuenta? <a href="/registro">Regístrate aquí</a></p>
        </form>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', manejarLogin);
        configurarAuth();
    </script>
</body>
</html>
