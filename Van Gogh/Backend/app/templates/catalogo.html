<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Ropa | Van Gogh</title>
    <link rel="stylesheet" href="/static/css/inicio.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body class="pagina-catalogo">
    <div class="swirl-container">
        <svg class="swirl-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <path d="M250,50 C350,50 450,150 450,250 C450,350 350,450 250,450 C150,450 50,350 50,250 C50,150 150,50 250,50 Z" fill="none" stroke="#d4af37" stroke-width="0.5"/>
            <path d="M250,100 C320,100 400,180 400,250 C400,320 320,400 250,400 C180,400 100,320 100,250 C100,180 180,100 250,100 Z" fill="none" stroke="#4a6fa5" stroke-width="0.3"/>
            <path d="M250,150 C290,150 350,210 350,250 C350,290 290,350 250,350 C210,350 150,290 150,250 C150,210 210,150 250,150 Z" fill="none" stroke="#d4af37" stroke-width="0.2"/>
        </svg>
    </div>
    <header>
      <div class="logo"><h1>Van Gogh</h1></div>
      <nav class="nav-container">
        <ul class="nav-links">
          <li><a href="/">Inicio</a></li>
          <li><a href="/catalogo">Productos</a></li>
          <li><a href="/ofertas">Ofertas</a></li>
          <li><a href="/#contacto">Contacto</a></li>
        </ul>
        <div class="user-menu">
          <div class="dropdown">
            <button class="dropbtn"><span class="material-symbols-outlined">account_circle</span><i class="arrow down"></i></button>
            <div class="dropdown-content">
              <a href="/login">Iniciar Sesión</a>
              <a href="/registro">Registrarse</a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="contenedor-catalogo">
        <aside class="filtros">
            <h2>Filtrar productos</h2>
            <div class="grupo-filtro">
                <h3>Categorías</h3>
                <div class="grupo-categorias"></div>
            </div>
            <div class="grupo-filtro">
                <h3>Talla</h3>
                <div id="filtro-talla"></div>
            </div>
            <div class="grupo-filtro">
                <h3>Precio Máximo</h3>
                <input type="range" min="0" max="500" id="rango-precio" value="500">
                <p>Hasta: <strong id="valor-precio">Bs. 500</strong></p>
            </div>
        </aside>

        <section class="contenido-principal">
            <div class="barra-herramientas">
                <input type="search" id="busqueda" placeholder="Buscar producto...">
                <select id="ordenar">
                    <option value="relevancia">Ordenar por: Relevancia</option>
                    <option value="menor">Precio: Menor a Mayor</option>
                    <option value="mayor">Precio: Mayor a Menor</option>
                </select>
            </div>
            <div class="grid-productos" id="lista-productos">
                <!-- Se llenará dinámicamente -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Van Gogh. Todos los derechos reservados.</p>
    </footer>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/catalogo.js"></script>
    <script src="/static/js/animations.js"></script>
</body>
</html>
